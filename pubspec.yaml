name: books
description: Personal Ebook Organizer
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Database
  sqflite: ^2.3.0
  path: ^1.9.0

  # File picking
  file_picker: ^11.0.2

  # Storage path
  path_provider: ^2.1.2

  # PDF Viewer
  syncfusion_flutter_pdfviewer: ^33.2.8

  # PDF page-to-image (for auto cover extraction)
  pdfrx: ^1.0.0

  # EPUB Viewer
  epub_view: ^3.2.0

  # UI
  flutter_staggered_grid_view: ^0.7.0
  cached_network_image: ^3.3.1
  google_fonts: ^8.1.0
  lottie: ^3.0.0

  # Utils
  share_plus: ^12.0.2
  open_filex: ^4.3.4
  intl: ^0.20.2
  uuid: ^4.3.3
  scrollable_positioned_list: ^0.3.8
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.11.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/

flutter_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
